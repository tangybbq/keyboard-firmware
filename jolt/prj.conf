CONFIG_RUST=y
CONFIG_RUST_ALLOC=y

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_LED=y
CONFIG_PWM=y

# The same identity as jolt-embassy-rp's usb.rs: keyminder, TaipoTeacher and
# the hidutil key remap all find the keyboard by this VID/PID.  MAX_POWER is
# in 2 mA units, so this is embassy's 100 mA.
CONFIG_SAMPLE_USBD_MANUFACTURER="TangyBBQ"
CONFIG_SAMPLE_USBD_PRODUCT="Jolt Keyboard"
CONFIG_SAMPLE_USBD_VID=0xC0DE
CONFIG_SAMPLE_USBD_PID=0xCAFE
CONFIG_SAMPLE_USBD_MAX_POWER=50

# Enable the Segger console.
CONFIG_USE_SEGGER_RTT=y

# Use the RTT Console
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
