# Keyboard firmware.

[package]
name = "rustapp"
version = "0.1.0"
edition = "2024"
description = "Rusty Zephyry Keyboard Firmware"
license = "Apache-2.0 or MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
# async-drivers is for the matrix's wait on a key interrupt.
zephyr = { version = "0.1.0", features = ["time-driver", "executor-zephyr", "async-drivers"] }
zephyr-panic = "0.1.0"
static_cell = "2.1"
heapless = "0.8"
smart-leds = "0.4.0"

# The minder protocol, for the host tools and TaipoTeacher.
minicbor = { version = "0.25.1", features = ["alloc"] }
sha2 = { version = "0.10.8", default-features = false }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"

# The tick rate is set per target below.
embassy-time = "0.5.1"
# log = "0.4.22"

# The zephyr crate's time driver hands embassy raw Zephyr ticks, so embassy's
# tick rate has to be the board's CONFIG_SYS_CLOCK_TICKS_PER_SEC, which lib.rs
# checks at compile time.  Cargo cannot see Kconfig, but each SoC builds for its
# own target: the RP2040 (thumbv6m) ticks at Zephyr's tickless default of 10 kHz,
# and the nRF52840 (thumbv7em) at its RTC's 32768 Hz.  With one rate for both,
# the mesa3w's timers ran 3.3 times fast.
[target.thumbv6m-none-eabi.dependencies]
embassy-time = { version = "0.5.1", features = ["tick-hz-10_000"] }

[target.thumbv7em-none-eabi.dependencies]
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }

[dependencies.bbq-keyboard]
version = "0.1.0"
default-features = false
features = ["proto3", "log"]
path = "../bbq-keyboard"

[dependencies.minder]
version = "0.1.0"
default-features = false
path = "../minder"

[dependencies.bbq-steno]
version = "0.1.0"
default-features = false
features = ["log"]
path = "../bbq-steno"
optional = true

[features]
# rust_cargo_application() passes no cargo features, so the default is the
# build; change it here for a different set of layouts.  Taipo and Orsy, as
# on jolt-embassy-rp; add qwerty and steno for its `just build-full`.
default = ["orsy"]

# The optional layouts.  Taipo is always built; leaving these out gives a
# firmware with no way to reach the other modes at all.
qwerty = ["bbq-keyboard/qwerty"]
steno = ["bbq-keyboard/steno", "dep:bbq-steno"]
orsy = ["bbq-keyboard/orsy"]

[build-dependencies]
zephyr-build = "0.1.0"

# Ensure we can debug.
[profile.release]
debug = true
overflow-checks = true

[profile.dev]
opt-level = 1
