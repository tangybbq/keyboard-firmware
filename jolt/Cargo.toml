# Keyboard firmware.

[package]
name = "rustapp"
version = "0.1.0"
edition = "2024"
description = "Rusty Zephyry Keyboard Firmware"
license = "Apache-2.0 or MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
zephyr = { version = "0.1.0", features = ["time-driver", "executor-zephyr"] }
zephyr-panic = "0.1.0"
static_cell = "2.1"
heapless = "0.8"
smart-leds = "0.4.0"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-sync = "0.8.0"

# The zephyr timer is able to adapt to a mismatch of the time base, however it
# is more efficient if the timer here matches the zephyr::time::SYS_FREQUENCY.
embassy-time = { version = "0.5.1", features = ["tick-hz-10_000"] }
# log = "0.4.22"

[dependencies.bbq-keyboard]
version = "0.1.0"
default-features = false
features = ["proto3", "log"]
path = "../bbq-keyboard"

[dependencies.bbq-steno]
version = "0.1.0"
default-features = false
features = ["log"]
path = "../bbq-steno"
optional = true

[features]
# rust_cargo_application() passes no cargo features, so the default is the
# build; change it here for a different set of layouts.  Taipo and Orsy, as
# on jolt-embassy-rp; add qwerty and steno for its `just build-full`.
default = ["orsy"]

# The optional layouts.  Taipo is always built; leaving these out gives a
# firmware with no way to reach the other modes at all.
qwerty = ["bbq-keyboard/qwerty"]
steno = ["bbq-keyboard/steno", "dep:bbq-steno"]
orsy = ["bbq-keyboard/orsy"]

[build-dependencies]
zephyr-build = "0.1.0"

# Ensure we can debug.
[profile.release]
debug = true
overflow-checks = true

[profile.dev]
opt-level = 1
