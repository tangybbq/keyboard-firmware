# The board's console is a CDC ACM port it sets up as a USB device of its own,
# which would be a second one on the controller jolt uses, and its UART is on
# matrix pins.  The console is RTT, as on the RP2040 boards.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# minder's boot id comes from Zephyr's random source here.
CONFIG_ENTROPY_GENERATOR=y

# Bluetooth HID; see jolt-mesa.md, "Bluetooth on the mesa3w".  Four profiles,
# on identities 1 to 4 (identity 0 cannot be reset, which clearing a profile
# needs), and a bond each; ble.c's PROFILE_COUNT has to agree, which it checks.
# A full key store refuses a new pairing rather than overwriting another
# profile's bond, and ble.c turns away a host pairing on a profile bonded to
# another, so a profile is given to a new host by clearing it.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=5
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# A host that lost its half of a Just Works bond pairs again from scratch,
# and Zephyr refuses that by default while the keyboard still holds its
# half.  With no passkey the old bond proves nothing anyway, so let the new
# pairing replace it.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# A host can be bonded on only one profile.  Pairing it on another moves the
# bond there, rather than Zephyr refusing it, possibly after the host has
# already counted the pairing done.
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
# ble.c adds the profile's number, "Jolt Keyboard 2", which needs the name to
# be settable at run time.
CONFIG_BT_DEVICE_NAME="Jolt Keyboard"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_APPEARANCE=961

# HID wants 11.25 to 15 ms; Apple's accessory rules allow it for HID.
# Peripheral latency 30 lets the keyboard skip up to 30 connection events in
# a row when it has nothing to send, so idle it answers the host about every
# 0.5 s rather than every 15 ms.  A key report cancels the skipping and goes
# at the next event, so typing is no slower; what the host sends (the Caps
# Lock LED, minder's requests) waits up to that 0.5 s while the keyboard is
# idle.  Apple's limits: interval max x (latency + 1) under 2 s (465 ms),
# and three times that under the supervision timeout (4 s).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Range over rate: a keyboard sends a few bytes at a time.  The radio's most,
# +8 dBm, from the default 0, costs current only while transmitting.  The 1M
# PHY hears about 4 dB further than 2M, so leave 2M out and a host cannot
# move the link to it.  A weak link loses nothing, but each retry delays the
# reports behind it, and a key-up held back past the host's repeat delay
# starts the key repeating.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_OUTPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_MAX_REPORT_LEN=8

# A notification sent from any thread but the system workqueue waits, for
# ever, when the ATT buffers are all taken, and the reports go from jolt's
# executor, which also scans the keys.  hid.rs allows four reports in flight
# (BLE_IN_FLIGHT_MAX), so the default three let the fourth stall typing until
# the link freed one.  Eight is room for those four, minder's replies, and the
# GATT responses besides, so that a send never waits.
CONFIG_BT_ATT_TX_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8

# Minder's packets (minder_ble.c) are up to 64 bytes, one per write or
# notification, which needs an ATT MTU of 67 both ways: a receive buffer of
# 71 (the MTU and the L2CAP header) and a transmit MTU of 67.
CONFIG_BT_BUF_ACL_RX_SIZE=71
CONFIG_BT_L2CAP_TX_MTU=67

# The PnP ID carries the USB identity, so that hosts that match the keyboard
# by vendor and product (the hidutil key remap) see the same one over the air.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0xC0DE
CONFIG_BT_DIS_PNP_PID=0xCAFE
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="TangyBBQ"

# Bonds and identities, kept in the storage partition.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# The defaults (1024 and 1200) are too small once pairing stores a bond to
# flash: the RX thread runs SMP and the connection callbacks, which call into
# Rust and log, and the system workqueue writes settings and advertises.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Logging through printk, so to the RTT console with jolt's own lines: the
# stack's warnings, and ble.c's and usb.c's messages, which register at info.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2
# Without these the error names in ble.c's messages print as empty strings.
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_HCI_ERR_TO_STR=y

# The battery: the overlay's divider and fuel gauge, read by battery.c.
# Their drivers (VOLTAGE_DIVIDER, FUEL_GAUGE_COMPOSITE, and the ADC) follow
# from the devicetree once these are on.
CONFIG_SENSOR=y
CONFIG_FUEL_GAUGE=y
# The Battery Service, which HOGP calls mandatory, given battery.c's readings.
CONFIG_BT_BAS=y

# Deep sleep (sleep.c): System OFF after 15 minutes without a key, on
# battery, any key waking it.  HWINFO is for the boot to say it woke.
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# The module's QSPI flash sits in deep power-down except while it is used.
# Its driver enters deep power-down only as a PM suspend, and with runtime
# PM (the overlay's `zephyr,pm-device-runtime-auto`) it is suspended right
# after init and between uses, waking for each operation.  Left in standby
# it costs about 13 uA, in System OFF as well.
#
# Nordic's SoCs turn runtime PM on for every device once it is enabled
# (PM_DEVICE_RUNTIME_DEFAULT_ENABLE); keep it to the nodes that ask for it:
# the flash, and the SoC's own choice of the SAADC (whose driver resumes
# it for each read) and the two I2C controllers (disabled here).  The GPIO,
# PWM and USB drivers stay as they were.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=n
