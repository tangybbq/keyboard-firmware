# The board's console is a CDC ACM port it sets up as a USB device of its own,
# which would be a second one on the controller jolt uses, and its UART is on
# matrix pins.  The console is RTT, as on the RP2040 boards.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# minder's boot id comes from Zephyr's random source here.
CONFIG_ENTROPY_GENERATOR=y

# Bluetooth HID; see jolt-mesa.md, "Bluetooth on the mesa3w".  One profile for
# now, on identity 1 (identity 0 cannot be reset, which clearing a profile
# needs), so two identities, and ble.c's PROFILE_COUNT has to agree.  With one
# profile a new pairing may as well replace the old bond; with more, a bonded
# profile will have to turn other hosts away instead.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# A host that lost its half of a Just Works bond pairs again from scratch,
# and Zephyr refuses that by default while the keyboard still holds its
# half.  With no passkey the old bond proves nothing anyway, so let the new
# pairing replace it.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_DEVICE_NAME="Jolt Keyboard"
CONFIG_BT_DEVICE_APPEARANCE=961

# HID wants 11.25 to 15 ms; Apple's accessory rules allow it for HID.  No
# peripheral latency yet, which costs idle current; that is a later step.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_OUTPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_MAX_REPORT_LEN=8

# The PnP ID carries the USB identity, so that hosts that match the keyboard
# by vendor and product (the hidutil key remap) see the same one over the air.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0xC0DE
CONFIG_BT_DIS_PNP_PID=0xCAFE
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="TangyBBQ"

# Bonds and identities, kept in the storage partition.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# The defaults (1024 and 1200) are too small once pairing stores a bond to
# flash: the RX thread runs SMP and the connection callbacks, which call into
# Rust and log, and the system workqueue writes settings and advertises.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Logging through printk, so to the RTT console with jolt's own lines: the
# stack's warnings, and ble.c's and usb.c's messages, which register at info.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=2
# Without these the error names in ble.c's messages print as empty strings.
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_HCI_ERR_TO_STR=y
