# Sysbuild for the mesa3w: MCUboot ahead of jolt; see jolt-mesa.md, "Updates
# over the air".  b-mesa3w.sh passes this as SB_CONF_FILE, and the signing
# key's path, which has to be absolute, on the command line.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
