# MCUboot's configuration for the mesa3w, beside its own prj.conf; given to
# it by b-mesa3w.sh.  The swap mode and the signature type come from
# sysbuild.conf.

# The xiao_ble board's console is a CDC ACM port on the USB controller, which
# MCUboot has no use for.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

# Slot 1 is on the QSPI flash.  Its driver's page layout has to be the
# sector size, 4 KiB, to match slot 0's pages, as swap using move needs.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# Slot 0 is 185 sectors.  The automatic count cannot see slot 1's sector
# size (the QSPI node has no erase-block-size) and warns, so set it; a
# larger slot 0 later costs only RAM here.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# A wake from System OFF is a reset, so MCUboot runs before every first key.
# Checking slot 0's hash and signature each time would hold that key back;
# an image is checked once, in slot 1, before it is swapped in.
CONFIG_BOOT_VALIDATE_SLOT0=n

# MCUboot and jolt are flashed with the J-Link; a UF2 of either alone would
# only confuse.
CONFIG_BUILD_OUTPUT_UF2=n
